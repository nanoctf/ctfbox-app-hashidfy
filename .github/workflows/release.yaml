
name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: 386 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }

          # Windows
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: 386 }

          # macOS
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

          # FreeBSD
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: freebsd, goarch: 386 }

          # OpenBSD
          - { goos: openbsd, goarch: amd64 }
          - { goos: openbsd, goarch: arm64 }
          - { goos: openbsd, goarch: 386 }
          - { goos: openbsd, goarch: ppc64 }

          # NetBSD
          - { goos: netbsd, goarch: amd64 }
          - { goos: netbsd, goarch: arm64 }
          - { goos: netbsd, goarch: 386 }
          - { goos: netbsd, goarch: arm }

          # DragonFly BSD
          - { goos: dragonfly, goarch: amd64 }

          # Solaris
          - { goos: solaris, goarch: amd64 }

          # illumos
          - { goos: illumos, goarch: amd64 }

          # WebAssembly
          - { goos: js, goarch: wasm }
          - { goos: wasip1, goarch: wasm }

    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        shell: bash
        run: |
          mkdir -p dist

          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          elif [ "${{ matrix.goos }}" = "js" ] || [ "${{ matrix.goos }}" = "wasip1" ]; then
            EXT=".wasm"
          fi

          BINARY="hash-identify${EXT}"
          ARCHIVE="hash-identify_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

          CGO_ENABLED=0 \
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          go build \
            -trimpath \
            -ldflags="-s -w -buildid=" \
            -o "dist/$BINARY" .

          cd dist
          zip -j "$ARCHIVE" "$BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hash-identify-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hash-identify-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
